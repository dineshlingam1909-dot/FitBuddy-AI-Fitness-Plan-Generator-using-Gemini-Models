<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - Admin Dashboard</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #0f172a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }
        th {
            background-color: #1e293b;
            color: white;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 250px;
            overflow-y: auto;
            margin: 0;
            font-size: 12px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>FitBuddy - All Users & Workout Plans</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Weight (kg)</th>
                <th>Goal</th>
                <th>Intensity</th>
                <th>Original Plan</th>
                <th>Updated Plan</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.age }}</td>
                <td>{{ user.weight }}</td>
                <td>{{ user.goal }}</td>
                <td>{{ user.intensity }}</td>
                <td><pre>{{ user.original_plan }}</pre></td>
                <td><pre>{{ user.updated_plan }}</pre></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
