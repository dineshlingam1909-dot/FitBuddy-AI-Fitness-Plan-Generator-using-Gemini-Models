<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Workout Generator</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('/static/images/gym-bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        select option {
            background: #222222;
            color: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💪 FitBuddy - AI Workout Generator</h2>
        <form action="/generate-workout" method="post">
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" placeholder="e.g. John Doe" required>

            <label for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" placeholder="e.g. 10" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="e.g. 25" required>

            <label for="weight">Weight (kg):</label>
            <input type="number" step="0.1" id="weight" name="weight" placeholder="e.g. 70.5" required>

            <label for="goal">Fitness Goal:</label>
            <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, flexibility" required>

            <label for="intensity">Workout Intensity:</label>
            <select id="intensity" name="intensity">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Generate Plan</button>
        </form>
    </div>
</body>
</html>
