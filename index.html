<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FitBuddy - AI Fitness Planner
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<main class="container">

    <section class="hero">

        <p class="eyebrow">
            AI FITNESS PLANNER
        </p>

        <h1>
            FitBuddy
        </h1>

        <p>
            Generate your personalized
            7-day fitness plan using AI.
        </p>

    </section>


    {% if error %}

    <div class="alert error">

        {{ error }}

    </div>

    {% endif %}


    <section class="card">

        <h2>
            Create Your Fitness Plan
        </h2>


        <form
            method="post"
            action="/generate-workout"
            class="grid"
        >

            <label>

                Name

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </label>


            <label>

                User ID

                <input
                    type="text"
                    name="user_id"
                    placeholder="FB001"
                    required
                >

            </label>


            <label>

                Age

                <input
                    type="number"
                    name="age"
                    min="13"
                    max="100"
                    required
                >

            </label>


            <label>

                Weight (kg)

                <input
                    type="number"
                    name="weight"
                    min="20"
                    max="400"
                    step="0.1"
                    required
                >

            </label>


            <label>

                Fitness Goal

                <select
                    name="goal"
                    required
                >

                    <option value="weight loss">
                        Weight Loss
                    </option>

                    <option value="muscle gain">
                        Muscle Gain
                    </option>

                    <option value="general wellness">
                        General Wellness
                    </option>

                    <option value="flexibility">
                        Flexibility
                    </option>

                    <option value="fitness">
                        General Fitness
                    </option>

                </select>

            </label>


            <label>

                Workout Intensity

                <select
                    name="intensity"
                    required
                >

                    <option value="low">
                        Low
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>

            </label>


            <div class="full">

                <button
                    type="submit"
                >
                    Generate 7-Day Plan
                </button>

            </div>

        </form>

    </section>


    <p class="small">

        FitBuddy provides general wellness
        information and is not a medical
        diagnosis or treatment system.

    </p>


    <a
        href="/view-all-users"
        class="admin-link"
    >
        View Admin Dashboard →
    </a>

</main>

</body>

</html>
